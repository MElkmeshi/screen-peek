name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Build universal app
        run: mac/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: ScreenPeek-mac
          path: mac/build/ScreenPeek.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Publish
        shell: pwsh
        run: |
          foreach ($rid in 'win-x64', 'win-arm64') {
            dotnet publish windows/ScreenPeek.csproj -c Release -r $rid --self-contained true `
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
              -p:EnableCompressionInSingleFile=true -o "windows/build/$rid"
            Copy-Item "windows/build/$rid/ScreenPeek.exe" "windows/build/ScreenPeek-$rid.exe"
          }
      - uses: actions/upload-artifact@v7
        with:
          name: ScreenPeek-windows
          path: windows/build/ScreenPeek-*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            ScreenPeek.dmg
            ScreenPeek-win-x64.exe
            ScreenPeek-win-arm64.exe
